# ~/.config/helix/config.toml
theme = "dracula"

[editor]
color-modes = true
end-of-line-diagnostics = "hint"
# line-number = "relative"

[editor.cursor-shape]
insert = "block"
normal = "block"
select = "underline"

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-inlay-hints = true
